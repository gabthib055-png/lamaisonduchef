<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Envoyer une commande</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header>
      <h1>Envoyer une commande</h1>
    </header>
    <main>
      <p class="status" id="connection-status">Connexion...</p>

      <div class="card">
        <div class="form-row">
          <label for="productName">Nom du produit</label>
          <input id="productName" type="text" placeholder="Ex: Filet de boeuf" />
        </div>
        <div class="form-row">
          <label for="quantity">Quantite</label>
          <input id="quantity" type="number" min="1" value="1" />
        </div>
        <div class="form-row">
          <label for="comments">Commentaires client</label>
          <textarea
            id="comments"
            rows="3"
            placeholder="Cuisson, allergie, demande speciale..."
          ></textarea>
        </div>
        <div class="form-row">
          <label for="table">Numero de table</label>
          <input id="table" type="text" placeholder="Ex: Table 42" />
        </div>
        <div class="form-actions">
          <button id="send-kitchen">Envoyer en cuisine</button>
          <button id="send-bar" class="secondary">Envoyer au bar</button>
        </div>
        <p class="status" id="form-status"></p>
      </div>
    </main>

    <script src="/js/commande.js"></script>
  </body>
</html>
